manifest_version = 2
id = "minimal-native-plugin"
name = "Minimal Native Plugin"
version = "1.1.0"
type = "ui"
protocol_version = 1
python_version = "3.14"
activation_events = ["onView:minimal-native-plugin.main"]
permissions = []
platforms = ["linux", "macos", "windows", "android"]

[[contributes.navigation_containers]]
id = "minimal-native-plugin"
title = "Native"
icon = { material = "extension_outlined" }

[[contributes.views]]
id = "minimal-native-plugin.main"
container = "minimal-native-plugin"
title = "Native"
renderer = "native.form"
