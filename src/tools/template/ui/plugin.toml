manifest_version = 2
id = "<plugin-id>"
name = "<PluginId>"
version = "1.0.0"
type = "ui"
protocol_version = 1
author = "Your name"
activation_events = ["onView:<plugin-id>.main"]
permissions = ["ui.view"]
platforms = ["linux", "macos", "windows", "android"]

[[contributes.navigation_containers]]
id = "<plugin-id>"
title = "Template"
icon = { material = "extension_outlined" }

[[contributes.views]]
id = "<plugin-id>.main"
container = "<plugin-id>"
title = "Template"
renderer = "native.form"
