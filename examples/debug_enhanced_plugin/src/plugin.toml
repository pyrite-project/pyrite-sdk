manifest_version = 2
id = "debug-enhanced"
name = "调试加强"
version = "1.6.0"
type = "ui"
protocol_version = 1
python_version = "3.14"
author = "PyriteIDE"
description = "Outline and runtime variable inspection for Python"
activation_events = [
  "onView:debug-enhanced.outline",
  "onView:debug-enhanced.device-variables",
  "onCommand:debug-enhanced.refreshVariables",
]
permissions = ["ui.view", "editor.read", "editor.write", "tab.create", "runtime.inspect"]
platforms = ["linux", "macos", "windows", "android"]

[icons]
full = "assets/icons/plugin.png"
monochrome = "assets/icons/plugin-mono.png"

[[contributes.navigation_containers]]
id = "debug-enhanced"
title = "调试加强"
icon = { asset = "assets/icons/plugin-mono.png" }
location = "primary"
order = 100

[[contributes.views]]
id = "debug-enhanced.outline"
container = "debug-enhanced"
title = "大纲"
renderer = "native.outline"
icon = { material = "account_tree_outlined" }
order = 10

[[contributes.views]]
id = "debug-enhanced.device-variables"
container = "debug-enhanced"
title = "设备变量"
renderer = "native.variableInspector"
icon = { material = "data_object" }
order = 20

[[contributes.commands]]
id = "debug-enhanced.refreshVariables"
title = "刷新设备变量"
icon = { material = "refresh" }
order = 10

[[contributes.menus]]
location = "view/title"
view = "debug-enhanced.device-variables"
command = "debug-enhanced.refreshVariables"
group = "navigation"
order = 10

[[contributes.menus]]
location = "view/context"
view = "debug-enhanced.device-variables"
command = "debug-enhanced.refreshVariables"
group = "navigation"
order = 10

[[contributes.configuration]]
id = "debug-enhanced.showPrivate"
title = "显示私有变量"
type = "boolean"
default = false
order = 20
