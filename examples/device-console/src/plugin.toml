manifest_version = 2
id = "template-ui-plugin"
name = "Template UI Plugin"
version = "1.0.0"
type = "ui"
protocol_version = 1
python_version = "3.14"
author = "Your name"
activation_events = ["onView:template-ui-plugin.main"]
permissions = ["ui.view"]
platforms = ["linux", "macos", "windows", "android"]

[[contributes.navigation_containers]]
id = "template-ui-plugin"
title = "Template"
icon = { material = "extension_outlined" }

[[contributes.views]]
id = "template-ui-plugin.main"
container = "template-ui-plugin"
title = "Template"
renderer = "native.form"
